<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HMI 작화 PoC</title>
<style>
  :root {
    --bg: #1b1f26;
    --panel: #242a33;
    --panel2: #2c333e;
    --line: #3a4250;
    --fg: #e6eaf0;
    --dim: #97a1b0;
    --accent: #4da3ff;
    --canvas: #10141a;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: flex; flex-direction: column;
    font: 13px/1.5 "Malgun Gothic", "Apple SD Gothic Neo", system-ui, sans-serif;
    background: var(--bg); color: var(--fg);
  }
  header {
    display: flex; align-items: center; gap: 8px;
    padding: 8px 12px; background: var(--panel); border-bottom: 1px solid var(--line);
  }
  header h1 { font-size: 14px; margin: 0 12px 0 0; font-weight: 600; }
  button, select {
    background: var(--panel2); color: var(--fg); border: 1px solid var(--line);
    border-radius: 4px; padding: 5px 10px; font: inherit; cursor: pointer;
  }
  button:hover { border-color: var(--accent); }
  button.on { background: var(--accent); border-color: var(--accent); color: #08111c; font-weight: 600; }
  main { flex: 1; display: flex; min-height: 0; }
  aside {
    width: 168px; background: var(--panel); border-right: 1px solid var(--line);
    padding: 10px; overflow: auto;
  }
  aside.right { width: 260px; border-right: 0; border-left: 1px solid var(--line); }
  .grp { font-size: 11px; color: var(--dim); text-transform: uppercase;
         letter-spacing: .06em; margin: 12px 0 6px; }
  .grp:first-child { margin-top: 0; }
  .pal { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .pal button { padding: 8px 4px; font-size: 12px; }
  #stage { flex: 1; overflow: auto; background: var(--canvas); position: relative; }
  svg#sheet { display: block; background: #0d1117; }
  .sel { outline: none; }
  .selbox { fill: none; stroke: var(--accent); stroke-width: 1.5; stroke-dasharray: 4 3; }
  label.f { display: block; margin: 8px 0 2px; color: var(--dim); font-size: 11px; }
  input, aside select {
    width: 100%; background: var(--canvas); color: var(--fg);
    border: 1px solid var(--line); border-radius: 4px; padding: 5px 7px; font: inherit;
  }
  .row { display: flex; gap: 6px; }
  .tag { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 11px; }
  table.tags { width: 100%; border-collapse: collapse; font-size: 11px; }
  table.tags td { padding: 2px 4px; border-bottom: 1px solid var(--line); }
  table.tags td:last-child { text-align: right; font-family: ui-monospace, Menlo, Consolas, monospace; }
  .hint { color: var(--dim); font-size: 11px; margin-top: 10px; line-height: 1.6; }
  .chip {
    font-size: 11px; padding: 3px 9px; border-radius: 10px;
    border: 1px solid var(--line); background: var(--panel2);
  }
  .chip.off  { color: var(--dim); }
  .chip.live { color: #0d1117; background: #3ddc84; border-color: #3ddc84; font-weight: 600; }
  .chip.down { color: #0d1117; background: #ff5f56; border-color: #ff5f56; font-weight: 600; }
  @keyframes spin { to { transform: rotate(360deg); } }
  /* SVG에서 transform-origin의 기본 기준은 뷰포트(view-box)라 심볼이 화면 밖으로 튄다.
     fill-box를 지정해야 심볼 자기 자신의 중심을 축으로 돈다. */
  .spin { animation: spin 1.1s linear infinite; transform-box: fill-box; transform-origin: center; }
</style>
</head>
<body>

<header>
  <h1>HMI 작화 PoC</h1>
  <button id="btnEdit" class="on">편집</button>
  <button id="btnRun">런타임</button>
  <span style="width:12px"></span>
  <button id="btnSave">JSON 저장</button>
  <button id="btnLoad">불러오기</button>
  <button id="btnDemo">샘플 화면</button>
  <button id="btnClear">전체 삭제</button>
  <span style="flex:1"></span>
  <span id="link" class="chip off">모의 데이터</span>
  <span id="status" class="hint" style="margin:0"></span>
</header>

<main>
  <aside>
    <div class="grp">심볼</div>
    <div class="pal" id="palette"></div>
    <div class="hint">
      팔레트에서 심볼을 고른 뒤 캔버스를 클릭하면 배치됩니다.<br>
      드래그로 이동, Delete 키로 삭제.
    </div>
  </aside>

  <div id="stage">
    <svg id="sheet" width="1100" height="680" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
          <path d="M20 0H0V20" fill="none" stroke="#1b2230" stroke-width="1"/>
        </pattern>
      </defs>
      <rect id="bg" width="100%" height="100%" fill="url(#grid)"/>
      <g id="layer"></g>
      <rect id="selbox" class="selbox" style="display:none"/>
    </svg>
  </div>

  <aside class="right">
    <div class="grp">속성</div>
    <div id="props"><div class="hint">선택된 심볼이 없습니다.</div></div>
    <div class="grp">라이브 포인트</div>
    <table class="tags"><tbody id="tagTable"></tbody></table>
    <div class="hint">런타임 모드에서 모의 데이터가 갱신됩니다. 실제 연동 시 이 표가 SOX/BACnet 구독 결과로 대체됩니다.</div>
  </aside>
</main>

<script>
"use strict";

/* ------------------------------------------------------------------ *
 * 1. 포인트(태그) 테이블 — 실제 시스템에서는 SOX/BACnet 구독 결과가 들어온다.
 * ------------------------------------------------------------------ */
const TAGS = {
  AHU1_SF_RUN:   { v: 1,    kind: "bool"  },
  AHU1_RF_RUN:   { v: 0,    kind: "bool"  },
  AHU1_SA_TEMP:  { v: 14.2, kind: "float", lo: 10, hi: 22 },
  AHU1_RA_TEMP:  { v: 24.6, kind: "float", lo: 20, hi: 28 },
  CHW_VLV_POS:   { v: 62,   kind: "float", lo: 0,  hi: 100 },
  OA_DMP_POS:    { v: 30,   kind: "float", lo: 0,  hi: 100 },
  TANK1_LEVEL:   { v: 71,   kind: "float", lo: 0,  hi: 100 },
  PUMP1_RUN:     { v: 1,    kind: "bool"  },
  PUMP1_FAULT:   { v: 0,    kind: "bool"  },
  FILTER_ALARM:  { v: 0,    kind: "bool"  }
};
const TAG_NAMES = Object.keys(TAGS);

/* ------------------------------------------------------------------ *
 * 2. 심볼 정의 — 각 심볼은 순수 SVG 조각 + 애니메이션 훅을 갖는다.
 *    draw(node)  : SVG 요소 생성
 *    apply(g,node,val) : 런타임 값 반영
 * ------------------------------------------------------------------ */
const NS = "http://www.w3.org/2000/svg";
const el = (t, a = {}) => {
  const e = document.createElementNS(NS, t);
  for (const k in a) e.setAttribute(k, a[k]);
  return e;
};

const SYMBOLS = {
  tank: {
    label: "탱크", w: 90, h: 120, defaultMode: "level",
    draw(n) {
      const g = el("g");
      g.appendChild(el("rect", { x: 0, y: 0, width: n.w, height: n.h, rx: 8,
        fill: "#151b24", stroke: "#5b6675", "stroke-width": 2 }));
      const fill = el("rect", { x: 3, y: 3, width: n.w - 6, height: 0, rx: 6, fill: "#2f7fd4" });
      fill.dataset.part = "level";
      g.appendChild(fill);
      const t = el("text", { x: n.w / 2, y: n.h + 16, "text-anchor": "middle",
        fill: "#97a1b0", "font-size": 12 });
      t.dataset.part = "readout";
      g.appendChild(t);
      return g;
    },
    apply(g, n, val) {
      const pct = Math.max(0, Math.min(100, num(val)));
      const f = g.querySelector('[data-part="level"]');
      const h = (n.h - 6) * pct / 100;
      f.setAttribute("height", h);
      f.setAttribute("y", 3 + (n.h - 6 - h));
      g.querySelector('[data-part="readout"]').textContent = pct.toFixed(0) + " %";
    }
  },

  pump: {
    label: "펌프", w: 70, h: 70, defaultMode: "rotate",
    draw(n) {
      const g = el("g");
      const r = n.w / 2;
      g.appendChild(el("circle", { cx: r, cy: r, r: r - 2, fill: "#1d2530",
        stroke: "#5b6675", "stroke-width": 2 }));
      const blades = el("g");
      blades.dataset.part = "rotor";
      for (let i = 0; i < 3; i++) {
        const b = el("rect", { x: r - 3, y: 8, width: 6, height: r - 8, rx: 3, fill: "#4da3ff" });
        b.setAttribute("transform", `rotate(${i * 120} ${r} ${r})`);
        blades.appendChild(b);
      }
      g.appendChild(blades);
      g.appendChild(el("circle", { cx: r, cy: r, r: 5, fill: "#97a1b0" }));
      return g;
    },
    apply(g, n, val) {
      const on = truthy(val);
      const rotor = g.querySelector('[data-part="rotor"]');
      rotor.classList.toggle("spin", on);
      rotor.querySelectorAll("rect").forEach(b => b.setAttribute("fill", on ? "#3ddc84" : "#5b6675"));
    }
  },

  fan: {
    label: "팬", w: 76, h: 76, defaultMode: "rotate",
    draw(n) {
      const g = el("g");
      const r = n.w / 2;
      g.appendChild(el("rect", { x: 0, y: 0, width: n.w, height: n.h, rx: 6,
        fill: "#1d2530", stroke: "#5b6675", "stroke-width": 2 }));
      const rotor = el("g");
      rotor.dataset.part = "rotor";
      for (let i = 0; i < 4; i++) {
        const p = el("ellipse", { cx: r, cy: r - 14, rx: 7, ry: 15, fill: "#4da3ff" });
        p.setAttribute("transform", `rotate(${i * 90} ${r} ${r})`);
        rotor.appendChild(p);
      }
      g.appendChild(rotor);
      return g;
    },
    apply(g, n, val) {
      const on = truthy(val);
      const rotor = g.querySelector('[data-part="rotor"]');
      rotor.classList.toggle("spin", on);
      rotor.querySelectorAll("ellipse").forEach(b => b.setAttribute("fill", on ? "#3ddc84" : "#5b6675"));
    }
  },

  valve: {
    label: "밸브", w: 64, h: 52, defaultMode: "level",
    draw(n) {
      const g = el("g");
      const cy = n.h / 2;
      g.appendChild(el("path", {
        d: `M2 ${cy - 18} L2 ${cy + 18} L${n.w - 2} ${cy - 18} L${n.w - 2} ${cy + 18} Z`,
        fill: "#1d2530", stroke: "#5b6675", "stroke-width": 2
      }));
      const body = el("path", {
        d: `M2 ${cy - 18} L2 ${cy + 18} L${n.w - 2} ${cy - 18} L${n.w - 2} ${cy + 18} Z`,
        fill: "#2f7fd4", "fill-opacity": 0.2
      });
      body.dataset.part = "body";
      g.appendChild(body);
      const t = el("text", { x: n.w / 2, y: n.h + 14, "text-anchor": "middle",
        fill: "#97a1b0", "font-size": 12 });
      t.dataset.part = "readout";
      g.appendChild(t);
      return g;
    },
    apply(g, n, val) {
      const pct = Math.max(0, Math.min(100, num(val)));
      g.querySelector('[data-part="body"]').setAttribute("fill-opacity", (pct / 100).toFixed(2));
      g.querySelector('[data-part="readout"]').textContent = pct.toFixed(0) + " %";
    }
  },

  damper: {
    label: "댐퍼", w: 80, h: 60, defaultMode: "level",
    draw(n) {
      const g = el("g");
      g.appendChild(el("rect", { x: 0, y: 0, width: n.w, height: n.h, rx: 4,
        fill: "#151b24", stroke: "#5b6675", "stroke-width": 2 }));
      const blades = el("g");
      blades.dataset.part = "blades";
      for (let i = 0; i < 3; i++) {
        const y = 12 + i * 18;
        const b = el("rect", { x: 6, y: y - 3, width: n.w - 12, height: 6, rx: 3, fill: "#4da3ff" });
        b.setAttribute("transform", `rotate(0 ${n.w / 2} ${y})`);
        b.dataset.cy = y;
        blades.appendChild(b);
      }
      g.appendChild(blades);
      return g;
    },
    apply(g, n, val) {
      const pct = Math.max(0, Math.min(100, num(val)));
      const ang = -pct * 0.7;  // 0% 수평 → 100% 거의 수직
      g.querySelectorAll('[data-part="blades"] rect').forEach(b => {
        b.setAttribute("transform", `rotate(${ang} ${n.w / 2} ${b.dataset.cy})`);
      });
    }
  },

  led: {
    label: "표시등", w: 34, h: 34, defaultMode: "color",
    draw(n) {
      const g = el("g");
      const c = el("circle", { cx: n.w / 2, cy: n.h / 2, r: n.w / 2 - 3,
        fill: "#5b6675", stroke: "#0d1117", "stroke-width": 3 });
      c.dataset.part = "lamp";
      g.appendChild(c);
      return g;
    },
    apply(g, n, val) {
      g.querySelector('[data-part="lamp"]')
       .setAttribute("fill", truthy(val) ? (n.onColor || "#3ddc84") : (n.offColor || "#5b6675"));
    }
  },

  readout: {
    label: "수치", w: 110, h: 40, defaultMode: "text",
    draw(n) {
      const g = el("g");
      g.appendChild(el("rect", { x: 0, y: 0, width: n.w, height: n.h, rx: 4,
        fill: "#151b24", stroke: "#5b6675", "stroke-width": 1 }));
      const t = el("text", { x: n.w - 8, y: n.h / 2 + 6, "text-anchor": "end",
        fill: "#e6eaf0", "font-size": 17, "font-family": "ui-monospace, Menlo, monospace" });
      t.dataset.part = "readout";
      t.textContent = "--";
      g.appendChild(t);
      return g;
    },
    apply(g, n, val) {
      const t = g.querySelector('[data-part="readout"]');
      t.textContent = (typeof val === "number" ? val.toFixed(1) : String(val)) + (n.unit ? " " + n.unit : "");
    }
  },

  pipe: {
    label: "배관", w: 160, h: 14, defaultMode: "color",
    draw(n) {
      const g = el("g");
      const r = el("rect", { x: 0, y: 0, width: n.w, height: n.h, rx: n.h / 2,
        fill: "#3a4250", stroke: "#5b6675", "stroke-width": 1 });
      r.dataset.part = "lamp";
      g.appendChild(r);
      return g;
    },
    apply(g, n, val) {
      g.querySelector('[data-part="lamp"]')
       .setAttribute("fill", truthy(val) ? (n.onColor || "#2f7fd4") : (n.offColor || "#3a4250"));
    }
  },

  label: {
    label: "텍스트", w: 120, h: 24, defaultMode: "none",
    draw(n) {
      const g = el("g");
      const t = el("text", { x: 0, y: 17, fill: "#e6eaf0", "font-size": 14 });
      t.dataset.part = "label";
      t.textContent = n.text || "라벨";
      g.appendChild(t);
      return g;
    },
    apply(g, n, val) {
      g.querySelector('[data-part="label"]').textContent =
        n.mode === "text" ? String(val) : (n.text || "라벨");
    }
  }
};

const num = v => (typeof v === "number" ? v : Number(v) || 0);
const truthy = v => v === true || num(v) > 0.5;

/* ------------------------------------------------------------------ *
 * 3. 씬 모델 — 저장 포맷이 곧 이 JSON이다.
 * ------------------------------------------------------------------ */
let scene = { version: 1, width: 1100, height: 680, nodes: [] };
let selectedId = null;
let placing = null;
let runtime = false;
let seq = 1;

const layer  = document.getElementById("layer");
const selbox = document.getElementById("selbox");
const sheet  = document.getElementById("sheet");
const status = document.getElementById("status");

function addNode(type, x, y) {
  const s = SYMBOLS[type];
  const n = {
    id: "n" + (seq++), type,
    x: Math.round(x / 10) * 10, y: Math.round(y / 10) * 10,
    w: s.w, h: s.h,
    tag: "", mode: s.defaultMode,
    onColor: "#3ddc84", offColor: "#5b6675",
    text: s.label, unit: ""
  };
  scene.nodes.push(n);
  render();
  select(n.id);
  return n;
}

function render() {
  layer.textContent = "";
  for (const n of scene.nodes) {
    const g = SYMBOLS[n.type].draw(n);
    g.setAttribute("transform", `translate(${n.x},${n.y})`);
    g.dataset.id = n.id;
    g.style.cursor = runtime ? "default" : "move";
    layer.appendChild(g);
  }
  paint();
  drawSel();
  syncSubscription();   // 화면이 바뀌면 구독도 바뀐다
}

/** 런타임 값을 화면에 반영. 편집 모드에서는 중립값으로 미리보기. */
function paint() {
  for (const n of scene.nodes) {
    const g = layer.querySelector(`[data-id="${n.id}"]`);
    if (!g || n.mode === "none") continue;
    let v;
    if (runtime && n.tag && TAGS[n.tag]) v = TAGS[n.tag].v;
    else v = n.mode === "text" ? "--" : (n.mode === "level" ? 50 : 0);
    SYMBOLS[n.type].apply(g, n, v);
  }
}

function select(id) {
  selectedId = id;
  drawSel();
  showProps();
}

function drawSel() {
  const n = scene.nodes.find(v => v.id === selectedId);
  if (!n || runtime) { selbox.style.display = "none"; return; }
  selbox.style.display = "";
  selbox.setAttribute("x", n.x - 4);
  selbox.setAttribute("y", n.y - 4);
  selbox.setAttribute("width", n.w + 8);
  selbox.setAttribute("height", n.h + 8);
}

/* ------------------------------------------------------------------ *
 * 4. 편집 상호작용 — 배치 / 선택 / 드래그 / 삭제
 * ------------------------------------------------------------------ */
function svgPoint(evt) {
  const r = sheet.getBoundingClientRect();
  return { x: evt.clientX - r.left, y: evt.clientY - r.top };
}

let drag = null;

sheet.addEventListener("mousedown", evt => {
  if (runtime) return;
  const p = svgPoint(evt);

  if (placing) {
    addNode(placing, p.x - SYMBOLS[placing].w / 2, p.y - SYMBOLS[placing].h / 2);
    document.querySelectorAll("#palette button").forEach(b => b.classList.remove("on"));
    placing = null;
    setStatus("");
    return;
  }

  const g = evt.target.closest("[data-id]");
  if (!g) { select(null); return; }
  const n = scene.nodes.find(v => v.id === g.dataset.id);
  select(n.id);
  drag = { id: n.id, dx: p.x - n.x, dy: p.y - n.y };
});

window.addEventListener("mousemove", evt => {
  if (!drag) return;
  const p = svgPoint(evt);
  const n = scene.nodes.find(v => v.id === drag.id);
  n.x = Math.round((p.x - drag.dx) / 10) * 10;
  n.y = Math.round((p.y - drag.dy) / 10) * 10;
  layer.querySelector(`[data-id="${n.id}"]`).setAttribute("transform", `translate(${n.x},${n.y})`);
  drawSel();
});

window.addEventListener("mouseup", () => { drag = null; });

window.addEventListener("keydown", evt => {
  if (runtime || !selectedId) return;
  if (evt.key === "Delete" || evt.key === "Backspace") {
    if (document.activeElement && /INPUT|SELECT/.test(document.activeElement.tagName)) return;
    scene.nodes = scene.nodes.filter(n => n.id !== selectedId);
    selectedId = null;
    render();
    showProps();
  }
});

/* ------------------------------------------------------------------ *
 * 5. 속성 패널 — 심볼 ↔ 포인트 바인딩이 작화의 핵심이다.
 * ------------------------------------------------------------------ */
const MODES = {
  none:   "없음 (정적)",
  color:  "색 변화 (bool)",
  rotate: "회전 (bool)",
  level:  "레벨/개도 (0~100)",
  text:   "값 표시"
};

function showProps() {
  const box = document.getElementById("props");
  const n = scene.nodes.find(v => v.id === selectedId);
  if (!n) { box.innerHTML = '<div class="hint">선택된 심볼이 없습니다.</div>'; return; }

  box.innerHTML = `
    <div class="tag" style="color:var(--dim)">${n.id} · ${SYMBOLS[n.type].label}</div>
    <label class="f">포인트 태그</label>
    <select id="pTag">
      <option value="">(바인딩 없음)</option>
      ${TAG_NAMES.map(t => `<option ${t === n.tag ? "selected" : ""}>${t}</option>`).join("")}
    </select>
    <label class="f">애니메이션</label>
    <select id="pMode">
      ${Object.entries(MODES).map(([k, v]) =>
        `<option value="${k}" ${k === n.mode ? "selected" : ""}>${v}</option>`).join("")}
    </select>
    <label class="f">위치 / 크기</label>
    <div class="row">
      <input id="pX" type="number" value="${n.x}"><input id="pY" type="number" value="${n.y}">
    </div>
    <div class="row" style="margin-top:4px">
      <input id="pW" type="number" value="${n.w}"><input id="pH" type="number" value="${n.h}">
    </div>
    <label class="f">텍스트 / 단위</label>
    <div class="row">
      <input id="pText" value="${n.text || ""}"><input id="pUnit" value="${n.unit || ""}" placeholder="단위">
    </div>
    <label class="f">ON / OFF 색</label>
    <div class="row">
      <input id="pOn" type="color" value="${n.onColor}"><input id="pOff" type="color" value="${n.offColor}">
    </div>`;

  const bind = (id, key, cast = v => v) =>
    box.querySelector(id).addEventListener("input", e => {
      n[key] = cast(e.target.value);
      render();
    });

  bind("#pTag", "tag");
  bind("#pMode", "mode");
  bind("#pX", "x", Number); bind("#pY", "y", Number);
  bind("#pW", "w", Number); bind("#pH", "h", Number);
  bind("#pText", "text");   bind("#pUnit", "unit");
  bind("#pOn", "onColor");  bind("#pOff", "offColor");
}

/* ------------------------------------------------------------------ *
 * 6. 런타임 — 모의 데이터 틱. 실제로는 여기가 WebSocket 구독 콜백이 된다.
 * ------------------------------------------------------------------ */
function tick() {
  if (!runtime) return;
  if (live) return;          // 브리지에 붙어 있으면 모의 데이터를 만들지 않는다
  for (const name of Object.keys(TAGS)) {
    const t = TAGS[name];
    if (t.kind === "bool") {
      if (Math.random() < 0.04) t.v = t.v ? 0 : 1;
    } else {
      const span = (t.hi ?? 100) - (t.lo ?? 0);
      t.v = Math.max(t.lo ?? 0, Math.min(t.hi ?? 100,
            t.v + (Math.random() - 0.5) * span * 0.06));
    }
  }
  paint();
  showTags();
}

function showTags() {
  document.getElementById("tagTable").innerHTML = Object.keys(TAGS).map(n => {
    const t = TAGS[n];
    const v = t.kind === "bool" ? (t.v ? "ON" : "OFF") : Number(t.v).toFixed(1);
    const c = t.kind === "bool" ? (t.v ? "#3ddc84" : "#97a1b0") : "#e6eaf0";
    const stale = t.stale ? ' style="opacity:.4"' : "";
    return `<tr${stale}><td class="tag">${n}</td><td style="color:${c}">${v}</td></tr>`;
  }).join("");
}

setInterval(tick, 500);

/* ------------------------------------------------------------------ *
 * 6b. 브리지 연결 — ?ws=ws://host:8765 를 붙이면 실 데이터로 전환된다.
 *
 * 브라우저는 raw TCP 를 못 열기 때문에 장비에 직접 붙을 수 없다.
 * tools/point_bridge.py 가 장비(TCP) ↔ 화면(WebSocket) 을 중계한다.
 * ------------------------------------------------------------------ */
const WS_URL = new URLSearchParams(location.search).get("ws");
let ws = null;
let live = false;
let backoff = 1000;
let subscribed = "";

function setLink(cls, text) {
  const chip = document.getElementById("link");
  chip.className = "chip " + cls;
  chip.textContent = text;
}

/** 현재 화면이 실제로 쓰는 태그만 구독한다. 화면이 바뀌면 교체된다. */
function syncSubscription() {
  if (!ws || ws.readyState !== WebSocket.OPEN) return;
  const tags = [...new Set(scene.nodes.map(n => n.tag).filter(Boolean))].sort();
  const key = tags.join(",");
  if (key === subscribed) return;          // 같은 구독을 반복해서 보내지 않는다
  subscribed = key;
  ws.send(JSON.stringify({ op: "subscribe", tags }));
  setStatus(`구독 ${tags.length}개`);
}

function connect() {
  if (!WS_URL) return;
  setLink("off", "연결 중…");
  try { ws = new WebSocket(WS_URL); }
  catch (e) { scheduleReconnect(); return; }

  ws.onopen = () => {
    live = true;
    backoff = 1000;
    subscribed = "";
    setLink("live", "실 데이터");
    syncSubscription();
  };

  ws.onmessage = ev => {
    let msg;
    try { msg = JSON.parse(ev.data); } catch { return; }

    if (msg.op === "hello") {
      // 브리지가 알려준 포인트 목록으로 태그 테이블을 채운다.
      for (const [tag, kind] of Object.entries(msg.points || {})) {
        if (!TAGS[tag]) TAGS[tag] = { v: 0, kind };
      }
      setStatus(`브리지 연결 — 드라이버 ${msg.driver}, 주기 ${msg.interval}s`);
      showTags();

    } else if (msg.op === "values") {
      // 변경분만 온다. 없는 태그는 그대로 유지된다.
      for (const [tag, v] of Object.entries(msg.data || {})) {
        if (!TAGS[tag]) TAGS[tag] = { v, kind: typeof v === "boolean" ? "bool" : "float" };
        TAGS[tag].v = typeof v === "boolean" ? (v ? 1 : 0) : v;
        TAGS[tag].stale = false;
      }
      paint();
      showTags();

    } else if (msg.op === "error") {
      setStatus("브리지 오류: " + msg.message);
    }
  };

  ws.onclose = () => { live = false; setLink("down", "연결 끊김"); scheduleReconnect(); };
  ws.onerror = () => { try { ws.close(); } catch {} };
}

/** 지수 백오프 재연결. 현장에서 브리지 재기동·망 순단은 일상이다. */
function scheduleReconnect() {
  for (const t of Object.values(TAGS)) t.stale = true;
  showTags();
  setTimeout(connect, backoff);
  backoff = Math.min(backoff * 2, 15000);
}

connect();

/* ------------------------------------------------------------------ *
 * 7. 툴바
 * ------------------------------------------------------------------ */
function setMode(run) {
  runtime = run;
  document.getElementById("btnEdit").classList.toggle("on", !run);
  document.getElementById("btnRun").classList.toggle("on", run);
  if (run) select(null);
  render();
}

function setStatus(msg) { status.textContent = msg; }

document.getElementById("btnEdit").onclick = () => setMode(false);
document.getElementById("btnRun").onclick  = () => setMode(true);

document.getElementById("btnSave").onclick = () => {
  const blob = new Blob([JSON.stringify(scene, null, 2)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "hmi-scene.json";
  a.click();
  setStatus("hmi-scene.json 저장됨");
};

document.getElementById("btnLoad").onclick = () => {
  const inp = document.createElement("input");
  inp.type = "file"; inp.accept = ".json";
  inp.onchange = () => {
    const f = inp.files[0];
    if (!f) return;
    const rd = new FileReader();
    rd.onload = () => {
      try {
        scene = JSON.parse(rd.result);
        seq = scene.nodes.reduce((m, n) => Math.max(m, +n.id.slice(1) + 1), 1);
        render();
        setStatus(f.name + " 불러옴 (" + scene.nodes.length + "개)");
      } catch (e) { setStatus("JSON 파싱 실패: " + e.message); }
    };
    rd.readAsText(f);
  };
  inp.click();
};

document.getElementById("btnClear").onclick = () => {
  scene.nodes = []; selectedId = null; render(); showProps();
};

/* 팔레트 구성 */
const pal = document.getElementById("palette");
for (const [type, s] of Object.entries(SYMBOLS)) {
  const b = document.createElement("button");
  b.textContent = s.label;
  b.onclick = () => {
    const on = placing === type;
    document.querySelectorAll("#palette button").forEach(x => x.classList.remove("on"));
    placing = on ? null : type;
    if (placing) { b.classList.add("on"); setStatus("캔버스를 클릭해 배치"); }
    else setStatus("");
  };
  pal.appendChild(b);
}

showTags();
